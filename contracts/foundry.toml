[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Fijados para que el bytecode sea compatible con Arbitrum y con TVM (Tron):
# sin opcodes de Cancun/Osaka (MCOPY, TSTORE, CLZ). Ver docs/ARQUITECTURA.md (D9).
solc = "0.8.30"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./test/vectors" }]
# Halmos no soporta `vm.deployCode`: compilar los `new Contrato(...)` de las pruebas como CREATE normal.
dynamic_test_linking = false

[profile.default.fuzz]
runs = 2_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
arbitrum_one = "https://arb1.arbitrum.io/rpc"
ethereum = "https://ethereum-rpc.publicnode.com"

[fmt]
line_length = 110
