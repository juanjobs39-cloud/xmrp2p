# Configuración de gitleaks: reglas por defecto + excepciones justificadas.
[extend]
useDefault = true

[allowlist]
description = "Vectores de prueba públicos: escalares aleatorios generados para tests, nunca usados con fondos"
paths = [
  '''contracts/test/vectors/.*\.json''',
  '''crypto-wasm/tests/vectors/.*\.json''',
]
# Direcciones públicas de Ethereum (20 bytes = 40 hex; una llave privada tiene 64) y el marcador
# de los archivos de ejemplo. Una llave real de 64 hex sigue siendo detectada.
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  '''CAMBIA_ESTO''',
]
