name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    name: Buscar secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Escanea todo el historial (la acción oficial falla en el primer push porque el commit raíz no tiene padre).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  contratos:
    name: Contratos (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: FOUNDRY_PROFILE=ci forge test -vv

  contratos-fork:
    name: Contratos contra USDT real (fork)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: FORK_TESTS=true forge test --match-contract Fork -vv

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      # Falla solo con hallazgos de severidad media o alta; los informativos están en contracts/README.md.
      - run: slither contracts --filter-paths "lib|test|script" --fail-medium

  crypto-wasm:
    name: Núcleo cripto (Rust + WASM + vectores con monero-ts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crypto-wasm
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo install wasm-pack --locked --version 0.15.0
      - run: wasm-pack build --release --target web --out-dir pkg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vectores cruzados con monero-ts
        working-directory: crypto-wasm/tests/cross
        run: npm install && npm test

  maker:
    name: Daemon del maker (Python + anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crypto-wasm
      - run: cargo build --release --bin xmrp2p-crypto
        working-directory: crypto-wasm
      - run: forge build
        working-directory: contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "maker[dev]"
      - run: python -m pytest -q
        working-directory: maker

  dleq-research:
    name: DLEQ en Rust (Fase 0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/dleq-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: research/dleq-wasm
      - run: cargo test --release
      - run: cargo build --release --target wasm32-unknown-unknown
