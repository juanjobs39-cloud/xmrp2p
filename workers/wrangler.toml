# Worker principal de xmrp2p: API pública, libro de órdenes, canal de mensajes y MCP.
# Desplegar SOLO con aprobación del dueño (ver workers/README.md). Valores para testnet.
name = "xmrp2p-api"
main = "src/api/index.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Dominio propio (la URL de workers.dev sigue activa para pruebas)
routes = [{ pattern = "api.monerop2p.app", custom_domain = true }]

[vars]
# Redes activas (separadas por coma). Quitar una la desactiva sin tocar código.
# Beta con dinero real (Arbitrum One, tope de 100 USDT por swap en offers.ts/swaps.ts):
# activarla con ACTIVE_NETWORKS = "arbitrum_sepolia,arbitrum_one" y desplegar (solo con aprobación del dueño).
ACTIVE_NETWORKS = "arbitrum_sepolia,arbitrum_one"
# Países bloqueados (ISO 3166-1 alfa-2, separados por coma). Ej.: "US,KP".
BLOCKED_REGIONS = ""
# Orígenes permitidos para CORS ("*" para cualquiera; la API es pública y de solo lectura salvo makers firmados).
ALLOWED_ORIGINS = "*"
# Tiempo máximo de vida de una oferta (s): el maker la renueva mientras está en línea.
MAX_OFFER_TTL = "900"
# Tiempo que se espera la respuesta del maker a una solicitud de swap (ms).
TAKE_TIMEOUT_MS = "45000"
# Monitoreo de la fábrica con dinero real (vacío = apagado). Avisos por Telegram con los secretos
# TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID (wrangler secret put …).
MONITOR_FACTORY = "0x88fc05Cb07C5b69fbed1F7B1c1F784Cd26e99535"
MONITOR_RPC = "https://arb1.arbitrum.io/rpc"
MONITOR_EXPLORER = "https://arbiscan.io"
# Intercambios por Trocador (alternativa cuando no hay makers). La llave y la clave del webhook van como
# secretos: wrangler secret put TROCADOR_API_KEY / TROCADOR_WEBHOOK_KEY. Sin llave, las rutas responden 503.
API_URL = "https://api.monerop2p.app"
# Calificación KYC mínima de los exchanges (A = sin KYC … D = puede retener fondos).
TROCADOR_MIN_KYC = "B"
# Margen propio (%) incluido en la cotización. 0 = solo la mitad de la comisión de Trocador, sin empeorar el precio.
TROCADOR_MARKUP = "1"
# Avisos de intercambios abiertos desde el bot de Telegram (los manda el worker de P2P Fiat).
TELEGRAM_NOTIFY_URL = "https://fiat.monerop2p.app/v1/p2p/telegram/swap"
# Días que se guardan IP/idioma/navegador de los intercambios por Trocador. Vacío = indefinido (lo que pide Trocador).
TROCADOR_RETENTION_DAYS = ""
# P2P Fiat (XMR ↔ dinero fiat). Apagado: "" (las rutas /v1/p2p responden 404). Solo se enciende en pruebas.
P2P_ENABLED = ""
# Red de Monero del escrow: "stagenet" mientras se prueba; "mainnet" solo con aprobación del dueño.
P2P_XMR_NETWORK = "stagenet"
# Dirección (0x…) de la llave del administrador. Vacío = panel desactivado. El token del árbitro va como
# secreto: wrangler secret put P2P_ARBITER_TOKEN.
P2P_ADMIN_ADDRESS = ""
# Dirección de Monero donde cobra la plataforma (la del árbitro debe ser la misma).
P2P_FEE_ADDRESS = ""

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "xmrp2p-orderbook"
database_id = "c0f6152c-7e12-4f4a-a22d-bed94dd28b4c"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "MAKER_INBOX"
class_name = "MakerInbox"

[[durable_objects.bindings]]
name = "SWAP_ROOM"
class_name = "SwapRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MakerInbox", "SwapRoom"]

# P2P Fiat (beta, solo local por ahora): sala de cada orden (chat cifrado y estados).
[[durable_objects.bindings]]
name = "P2P_ORDER_ROOM"
class_name = "P2POrderRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["P2POrderRoom"]

# Límite de peticiones por IP (plan gratuito). Escrituras y solicitudes de swap.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Consultas a Trocador por IP (cotizar y crear intercambio): pocas, como acordamos con ellos.
[[ratelimits]]
name = "TROCADOR_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1002"
simple = { limit = 300, period = 60 }
