# Worker principal de xmrp2p: API pública, libro de órdenes, canal de mensajes y MCP.
# Desplegar SOLO con aprobación del dueño (ver workers/README.md). Valores para testnet.
name = "xmrp2p-api"
main = "src/api/index.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Dominio propio (la URL de workers.dev sigue activa para pruebas)
routes = [{ pattern = "api.monerop2p.app", custom_domain = true }]

[vars]
# Redes activas (separadas por coma). Quitar una la desactiva sin tocar código.
# Beta con dinero real (Arbitrum One, tope de 100 USDT por swap en offers.ts/swaps.ts):
# activarla con ACTIVE_NETWORKS = "arbitrum_sepolia,arbitrum_one" y desplegar (solo con aprobación del dueño).
ACTIVE_NETWORKS = "arbitrum_sepolia"
# Países bloqueados (ISO 3166-1 alfa-2, separados por coma). Ej.: "US,KP".
BLOCKED_REGIONS = ""
# Orígenes permitidos para CORS ("*" para cualquiera; la API es pública y de solo lectura salvo makers firmados).
ALLOWED_ORIGINS = "*"
# Tiempo máximo de vida de una oferta (s): el maker la renueva mientras está en línea.
MAX_OFFER_TTL = "900"
# Tiempo que se espera la respuesta del maker a una solicitud de swap (ms).
TAKE_TIMEOUT_MS = "45000"
# Monitoreo de la fábrica con dinero real (vacío = apagado). Avisos por Telegram con los secretos
# TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID (wrangler secret put …).
MONITOR_FACTORY = ""
MONITOR_RPC = "https://arb1.arbitrum.io/rpc"
MONITOR_EXPLORER = "https://arbiscan.io"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "xmrp2p-orderbook"
database_id = "c0f6152c-7e12-4f4a-a22d-bed94dd28b4c"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "MAKER_INBOX"
class_name = "MakerInbox"

[[durable_objects.bindings]]
name = "SWAP_ROOM"
class_name = "SwapRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MakerInbox", "SwapRoom"]

# Límite de peticiones por IP (plan gratuito). Escrituras y solicitudes de swap.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1002"
simple = { limit = 300, period = 60 }
